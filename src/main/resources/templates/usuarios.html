<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Usuarios | Biblioteca Virtual</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <!-- Inyectamos la barra de navegación maestra -->
        <div th:replace="~{fragmentos :: navbar}"></div>

        <!-- CONTENIDO ORIGINAL DEL MÓDULO DE USUARIOS -->
        <div class="container">
            <div class="card shadow border-0 rounded-3">
                <div class="card-header bg-dark text-white py-3">
                    <h3 class="mb-0">Usuarios Registrados</h3>
                </div>
                <div class="card-body p-4">

                    <div th:if="${mensaje}" th:classappend="${tipo == 'danger' ? 'alert-danger' : 'alert-success'}" class="alert alert-dismissible fade show fw-bold" role="alert">
                        <span th:text="${mensaje}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${mensajeBusqueda}" class="alert alert-warning alert-dismissible fade show" role="alert">
                        <span th:text="${mensajeBusqueda}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <a class="btn btn-success mb-4 fw-bold" th:href="@{/usuario/agregar}">
                        ➕ Registrar Nuevo Usuario
                    </a>

                    <div class="card mb-4 shadow-sm border-0 bg-light">
                        <div class="card-header bg-secondary text-white fw-bold">
                            🔍 Consultar Usuario
                        </div>
                        <div class="card-body">
                            <form th:action="@{/usuarios}" method="get" class="row g-3 align-items-center">
                                <div class="col-md-3">
                                    <input type="text" class="form-control" name="identificacion" placeholder="Identificación" th:value="${identificacionBuscar}">
                                </div>
                                <div class="col-md-3">
                                    <input type="text" class="form-control" name="nombre" placeholder="Nombre" th:value="${nombreBuscar}">
                                </div>
                                <div class="col-md-3">
                                    <input type="text" class="form-control" name="correo" placeholder="Correo" th:value="${correoBuscar}">
                                </div>
                                <div class="col-md-3 d-flex gap-2">
                                    <button type="submit" class="btn btn-primary fw-bold w-50">Buscar</button>
                                    <a th:href="@{/usuarios}" class="btn btn-outline-secondary w-50">Limpiar</a>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle border text-center">
                            <thead class="table-primary">
                                <tr>
                                    <th>Identificación</th>
                                    <th>Nombre</th>
                                    <th>Correo</th>
                                    <th>Rol</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="usuario : ${usuarios}">
                                    <td class="fw-bold text-secondary" th:text="${usuario.identificacion}"></td>
                                    <td th:text="${usuario.nombre} + ' ' + ${usuario.primerApellido}"></td>
                                    <td th:text="${usuario.correo}"></td>
                                    <td>
                                        <span th:class="${usuario.rol == 'ROLE_ADMIN' ? 'badge bg-danger' : 'badge bg-success'}" 
                                              th:text="${usuario.rol == 'ROLE_ADMIN' ? 'Administrador' : 'Estudiante'}"></span>
                                    </td>
                                    <td>
                                        <span th:class="${usuario.activo ? 'badge bg-primary' : 'badge bg-secondary'}"
                                              th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></span>
                                    </td>
                                    <td>
                                        <!-- AQUÍ ESTÁN LOS 3 BOTONES ALINEADOS -->
                                        <div class="d-flex gap-2 justify-content-center">
                                            
                                            <!-- Botón Editar -->
                                            <a class="btn btn-warning btn-sm fw-bold text-dark" th:href="@{'/usuario/modificar/' + ${usuario.identificacion}}">✏️ Editar</a>
                                            
                                            <!-- Botón Desactivar (Soft Delete) -->
                                            <form th:if="${usuario.activo}" th:action="@{'/usuario/desactivar/' + ${usuario.identificacion}}" method="post" onsubmit="return confirm('¿Desea desactivar este usuario?');">
                                                <button type="submit" class="btn btn-secondary btn-sm fw-bold" title="Baja Lógica">🚫 Desactivar</button>
                                            </form>

                                            <!-- NUEVO: Botón Eliminar (Hard Delete) -->
                                            <form th:action="@{'/usuario/eliminar/' + ${usuario.identificacion}}" method="post" onsubmit="return confirm('⚠️ ¿ESTÁS SEGURO? Esta acción borrará al usuario permanentemente y no se puede deshacer.');">
                                                <button type="submit" class="btn btn-danger btn-sm fw-bold" title="Baja Física">🗑️ Eliminar</button>
                                            </form>
                                            
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
