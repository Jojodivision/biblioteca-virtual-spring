<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verificación 2FA | Biblioteca</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold">Seguridad 2FA 🔐</h3>
            <p class="text-secondary">Hemos enviado un código de 6 dígitos a su correo electrónico administrativo.</p>
        </div>

        <div th:if="${error}" class="alert alert-danger text-center fw-bold" role="alert">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/2fa/verificar}" method="post">
            <div class="mb-3">
                <input type="text" name="codigo" class="form-control text-center fs-4 fw-bold" placeholder="000000" maxlength="6" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Verificar Identidad</button>
        </form>
    </div>

</body>
</html>
