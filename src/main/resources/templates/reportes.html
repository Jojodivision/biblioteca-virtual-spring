<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reportes | Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div th:replace="~{fragmentos :: navbar}"></div>

    <div class="container mt-5">
        <div class="card shadow" style="max-width: 600px; margin: auto;">
            <div class="card-header bg-dark text-white fw-bold">
                📊 Módulo de Reportes y Estadísticas
            </div>
            <div class="card-body p-4">

                <div th:if="${mensaje}" th:classappend="${tipo == 'warning' ? 'alert-warning' : 'alert-danger'}" class="alert alert-dismissible fade show fw-bold" role="alert">
                    <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/admin/reportes/generar}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Fecha de Inicio:</label>
                        <input type="date" name="fechaInicio" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Fecha de Fin:</label>
                        <input type="date" name="fechaFin" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Formato de Descarga:</label>
                        <select name="formato" class="form-select">
                            <option value="PDF">Documento PDF (.pdf)</option>
                            <option value="EXCEL">Hoja de Cálculo Excel (.xlsx)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">⬇️ Generar y Descargar Reporte</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
