<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mi Perfil | Biblioteca Virtual</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar simplificado para pantallas secundarias -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-5 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📚 Biblioteca Virtual</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-white" href="/">Volver al Catálogo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <h2 class="text-secondary fw-bold mb-4 text-center">Información de la Cuenta</h2>
                
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <h4 class="mb-0" th:text="${usuario.nombre + ' ' + usuario.apellidos}">Nombre del Usuario</h4>
                    </div>
                    <div class="card-body p-5">
                        <div class="row mb-3 pb-3 border-bottom">
                            <div class="col-sm-4 fw-bold text-secondary">Nombre de Usuario:</div>
                            <div class="col-sm-8 text-primary fw-bold" th:text="${usuario.username}">usuario123</div>
                        </div>
                        <div class="row mb-3 pb-3 border-bottom">
                            <div class="col-sm-4 fw-bold text-secondary">Correo Electrónico:</div>
                            <div class="col-sm-8" th:text="${usuario.correo}">correo@ejemplo.com</div>
                        </div>
                        <div class="row mb-3 pb-3 border-bottom">
                            <div class="col-sm-4 fw-bold text-secondary">Número de Teléfono:</div>
                            <div class="col-sm-8" th:text="${usuario.telefono}">8888-8888</div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-sm-4 fw-bold text-secondary">Rol de Acceso:</div>
                            <div class="col-sm-8">
                                <span th:class="${usuario.rol == 'ROLE_ADMIN' ? 'badge bg-danger' : 'badge bg-success'}" 
                                      th:text="${usuario.rol == 'ROLE_ADMIN' ? 'Administrador' : 'Estudiante'}">Rol</span>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
