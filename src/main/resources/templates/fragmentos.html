<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

    <!-- Definimos la pieza maestra que importaremos en las demás pantallas -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📚 Biblioteca Virtual</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item me-3"><a class="nav-link text-white fw-bold" th:href="@{/prestamos}">🔖 Préstamos</a></li>
                    <li class="nav-item me-3"><a class="nav-link text-white fw-bold" th:href="@{/encargos}">📦 Encargos</a></li>
                    <li class="nav-item me-3"><a class="nav-link text-danger fw-bold" th:href="@{/multas}">💰 Mis Multas</a></li>
                    
                    <!-- Menú desplegable para el Admin -->
                    <li class="nav-item dropdown me-3" sec:authorize="hasAuthority('ROLE_ADMIN')">
                        <a class="nav-link dropdown-toggle text-warning fw-bold text-decoration-underline" href="#" role="button" data-bs-toggle="dropdown">
                            ⚙️ Administración
                        </a>
                        <ul class="dropdown-menu shadow">
                            <li><a class="dropdown-item fw-bold" th:href="@{/usuarios}">Gestión de Usuarios</a></li>
                            <li><a class="dropdown-item fw-bold text-primary" th:href="@{/configuracion}">Reglas de Negocio</a></li>
                        </ul>
                    </li>
                    
                    <li class="nav-item me-3"><a class="nav-link text-white fw-bold" th:href="@{/perfil}">👤 Mi Perfil</a></li>
                    <li class="nav-item ms-3">
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="nav-link text-danger fw-bold border-0 bg-transparent">🚪 Salir</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

</body>
</html>
