<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title>Reglas de Negocio | Biblioteca Virtual</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">

        <!-- NAVBAR ESTANDARIZADO -->
        <!-- Inyectamos la barra de navegación maestra -->
        <div th:replace="~{fragmentos :: navbar}"></div>

        <div class="container">
            <!-- Alertas de éxito -->
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <strong th:text="${mensaje}"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm border-0 rounded-3">
                        <div class="card-header bg-dark text-white fw-bold py-3 text-center fs-5">
                            ⚙️ Configuración del Sistema
                        </div>
                        <div class="card-body p-5">
                            <form th:action="@{/configuracion/guardar}" th:object="${configuracion}" method="post">
                                <!-- El ID oculto asegura que siempre sobreescribamos la fila 1 -->
                                <input type="hidden" th:field="*{id}">

                                <div class="mb-4">
                                    <label class="form-label fw-bold text-secondary">Límite de Libros por Estudiante</label>
                                    <input type="number" class="form-control form-control-lg" th:field="*{maxLibros}" min="1" required>
                                    <div class="form-text">Cantidad máxima de reservas activas simultáneas.</div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold text-secondary">Días de Préstamo Permitidos</label>
                                    <input type="number" class="form-control form-control-lg" th:field="*{diasPrestamo}" min="1" required>
                                    <div class="form-text">Tiempo que el estudiante tiene para devolver el ejemplar.</div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-bold text-secondary">Tarifa Diaria por Morosidad (₡)</label>
                                    <input type="number" step="0.01" class="form-control form-control-lg" th:field="*{multaDiaria}" min="0" required>
                                    <div class="form-text">Monto que el sistema cobrará automáticamente cada noche a los atrasados.</div>
                                </div>

                                <div class="text-end mt-5">
                                    <button type="submit" class="btn btn-warning btn-lg fw-bold px-5">💾 Guardar Cambios</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
